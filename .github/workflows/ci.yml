# Gate for pull requests: nothing reaches master without a green run.
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm test` is vitest in watch mode, which would never exit here.
      - run: npx vitest run

      - run: npm run lint

      # Doubles as the typecheck — `build` is `tsc -b && vite build`.
      - run: npm run build
