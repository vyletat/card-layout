server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/css application/javascript application/json image/svg+xml application/manifest+json;

    # nginx drops every inherited add_header as soon as a location sets one of
    # its own, so this line is repeated in the locations below rather than
    # being stated once here.
    add_header X-Content-Type-Options nosniff always;

    # Vite fingerprints these filenames, so a cached copy can never be stale.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # The service worker is what decides when a client picks up a new build;
    # caching it would pin browsers to an old one.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Stated explicitly rather than relying on nginx's mime.types, which only
    # learned .webmanifest in recent versions.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # A client-side app with no server routes: every path serves the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
